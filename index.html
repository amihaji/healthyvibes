<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Jangan membawa URL halaman pelanggan saat menghubungi layanan lain. -->
    <meta name="referrer" content="no-referrer">
    <title>Healthy Vibes</title>
    <!-- Bootstrap dipatok versinya agar perubahan CDN tidak mengubah tampilan. -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    >
    <!-- Frontend statis dimuat dari repository, bukan template Apps Script. -->
    <link href="css/styles.css" rel="stylesheet">
  </head>
  <body>
    <header class="site-header">
      <button class="brand btn p-0" data-nav="shop" type="button">
        Healthy Vibes
      </button>
      <nav aria-label="Navigasi utama" class="d-flex gap-2 flex-wrap">
        <button class="btn btn-outline-dark" data-nav="shop" type="button">Menu</button>
        <button class="btn btn-outline-dark" data-nav="status" type="button">Status Pesanan</button>
        <button class="btn btn-outline-dark" data-nav="admin" type="button">Pengelola</button>
      </nav>
    </header>
    <!-- Pesan server dan loading dibaca juga oleh pembaca layar. -->
    <div id="notification" role="status" aria-live="polite" class="container mt-3"></div>
    <div id="busy" class="busy d-none" role="status">
      <span class="spinner-border spinner-border-sm" aria-hidden="true"></span>
      Memproses...
    </div>
    <main id="app" class="container py-4"></main>
    <footer class="container pb-4 text-secondary small">
      Makassar dan sekitarnya • WITA. Ongkir GoSend terpisah dari pembayaran produk.
    </footer>
    <!-- Dialog editor master dan detail pesanan tidak menghilangkan fitur di HP. -->
    <dialog id="editor" aria-labelledby="editor-title">
      <div class="d-flex justify-content-between gap-3 mb-3">
        <h2 id="editor-title" class="h4"></h2>
        <button type="button" class="btn btn-outline-dark" id="close-editor">Tutup</button>
      </div>
      <div id="editor-content"></div>
    </dialog>
    <!-- Konfigurasi endpoint harus dimuat sebelum transport dan aplikasi. -->
    <script src="js/config.js"></script>
    <script src="js/transport.js"></script>
    <script src="js/client.js"></script>
  </body>
</html>
