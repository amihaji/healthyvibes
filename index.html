<!doctype html>
<html lang="id">
  <head>
    <!-- Pengodean teks dan ukuran halaman agar sesuai dengan layar perangkat. -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Jangan membawa URL halaman pelanggan saat menghubungi layanan lain. -->
    <meta name="referrer" content="no-referrer">
    <title>Healthy Vibes</title>
    <!-- Bootstrap dipatok versinya agar perubahan CDN tidak mengubah tampilan. -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    >
    <!-- Frontend statis dimuat dari repository, bukan template Apps Script. -->
    <link href="css/styles.css" rel="stylesheet">
  </head>
  <body>
    <!-- Identitas layanan mengikuti gaya topbar BERATidealku. -->
    <div class="site-topbar">
      <div class="container topbar-inner">
        <span>Healthy Vibes by Klub KITA - Dibuat dengan sepenuh hati, dinikmati setiap hari</span>
        <span class="topbar-location">Makassar &amp; sekitarnya <span aria-hidden="true">&middot;</span> WITA</span>
      </div>
    </div>
    <!-- Header berisi logo, navigasi pelanggan, dan akses pengelola. -->
    <header class="site-header">
      <div class="container header-inner">
        <!-- Klik logo membuka kembali katalog Healthy Vibes. -->
        <button class="brand btn p-0" data-nav="shop" type="button" aria-label="Healthy Vibes, kembali ke katalog">
          <img src="image/Logo_HealthyVibes_Trans.png" alt="Healthy Vibes by Klub KITA" class="brand-logo" decoding="async">
        </button>
        <!-- Tautan Home membuka Berat Idealku; Katalog dan Status memakai halaman internal. -->
        <nav id="site-nav" aria-label="Navigasi utama" class="site-nav">
          <!-- <button class="nav-button" data-nav="home" type="button" aria-current="page">Home</button>-->
          <a class="nav-button" href="https://www.beratidealku.com"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m3 10 9-7 9 7v10H3Z"/><path d="M9 20v-7h6v7"/></svg><span>Home</span></a>
          <button class="nav-button" data-nav="shop" type="button" aria-current="page"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 6h16M4 12h16M4 18h16"/></svg><span>Katalog</span></button>
          <button class="nav-button" data-nav="status" type="button"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="5" y="5" width="14" height="16" rx="2"/><path d="M9 3h6v4H9ZM9 12h6M9 16h6"/></svg><span>Status Pesanan</span></button>
        </nav>
        <!-- Menu HP dan login pengelola memakai ikon tanpa dependensi font eksternal. -->
        <button class="icon-button nav-toggle" id="nav-toggle" type="button" aria-label="Buka menu navigasi" aria-controls="site-nav" aria-expanded="false">
          <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <!-- Ikon roda gigi membuka login atau panel pengelola. -->
        <button class="icon-button settings-button" data-nav="admin" type="button" aria-label="Admin" title="Admin">
          <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m9 3-.7 2.3-2 .9-2.2-.6-2 3.4 1.5 1.7v2.6L2.1 15l2 3.4 2.2-.6 2 .9L9 21h6l.7-2.3 2-.9 2.2.6 2-3.4-1.5-1.7v-2.6L21.9 9l-2-3.4-2.2.6-2-.9L15 3Z"/><circle cx="12" cy="12" r="3"/></svg><span class="header-action-text">Admin</span>
        </button>
      </div>
    </header>
    <!-- Pesan server dan loading dibaca juga oleh pembaca layar. -->
    <div id="notification" role="status" aria-live="polite" class="container mt-3"></div>
    <!-- Indikator ini ditampilkan JavaScript selama menunggu respons backend. -->
    <div id="busy" class="busy d-none" role="status">
      <span class="spinner-border spinner-border-sm" aria-hidden="true"></span>
      Memproses...
    </div>
    <!-- Isi halaman katalog, checkout, status, dan pengelola dibuat oleh client.js di sini. -->
    <main id="app" class="container py-4"></main>
    <!-- Identitas pendukung dan informasi layanan pada footer berlatar abu-abu muda. -->
    <footer class="site-footer">
      <div class="container">
        <div class="footer-brand">
          <span>Power By:</span>
          <img src="image/logo_beratidealku.png" alt="Berat Idealku" class="footer-logo" width="199" height="38" decoding="async">
        </div>
        <p class="footer-info small text-secondary mb-0">
          Makassar dan sekitarnya • WITA. Ongkir GoSend terpisah dari pembayaran produk.
        </p>
      </div>
    </footer>
    <!-- Dialog editor master dan detail pesanan tidak menghilangkan fitur di HP. -->
    <dialog id="editor" aria-labelledby="editor-title">
      <div class="d-flex justify-content-between gap-3 mb-3">
        <h2 id="editor-title" class="h4"></h2>
        <button type="button" class="btn btn-outline-dark" id="close-editor"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m6 6 12 12M6 18 18 6"/></svg><span>Tutup</span></button>
      </div>
      <div id="editor-content"></div>
    </dialog>
    <!-- Konfigurasi endpoint harus dimuat sebelum transport dan aplikasi. -->
    <script src="js/config.js"></script>
    <script src="js/transport.js"></script>
    <!-- Pembuat ikon dan label dimuat sebelum tombol halaman dibuat oleh client.js. -->
    <script src="js/icons.js"></script>
    <script src="js/client.js"></script>
  </body>
</html>
